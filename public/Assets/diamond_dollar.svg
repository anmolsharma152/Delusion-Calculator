<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 200" width="180" height="200">
  <defs>
    <!-- 24K Gold Frame Gradient -->
    <linearGradient id="goldEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="25%" stop-color="#FFE600" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="90%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Ice Diamond Core Gradient -->
    <linearGradient id="iceDiamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="20%" stop-color="#E0F7FA" />
      <stop offset="50%" stop-color="#00F5FF" />
      <stop offset="80%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Round Pavé Diamond Stud Gradient -->
    <radialGradient id="diamondStud" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#E0F2FE" />
      <stop offset="80%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#0369A1" />
    </radialGradient>

    <!-- Neon Ice Glow -->
    <filter id="iceGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#iceGlow)">
    <!-- 1. Two Vertical Parallel Pillar Bars (Classic Double-Stroked Dollar Sign) -->
    <!-- Left Vertical Gold Pillar -->
    <rect x="74" y="8" width="10" height="184" rx="5" fill="url(#goldEdge)" stroke="#78350F" stroke-width="1.5" />
    <rect x="76" y="12" width="6" height="176" rx="3" fill="url(#iceDiamondGrad)" />

    <!-- Right Vertical Gold Pillar -->
    <rect x="96" y="8" width="10" height="184" rx="5" fill="url(#goldEdge)" stroke="#78350F" stroke-width="1.5" />
    <rect x="98" y="12" width="6" height="176" rx="3" fill="url(#iceDiamondGrad)" />

    <!-- 2. Symmetrical 'S' Body (Outer Gold Chassis) -->
    <!-- S Path with Equal Upper & Lower Arcs -->
    <path
      d="M 136,66 
         C 136,36 116,20 90,20 
         C 64,20 44,36 44,66 
         C 44,92 72,98 90,100 
         C 108,102 136,108 136,134 
         C 136,164 116,180 90,180 
         C 64,180 44,164 44,134 
         L 64,134 
         C 64,152 74,162 90,162 
         C 106,162 116,152 116,134 
         C 116,112 92,106 72,102 
         C 52,98 24,90 24,66 
         C 24,36 48,4 90,4 
         C 132,4 156,36 156,66 
         Z"
      fill="url(#goldEdge)"
      stroke="#78350F"
      stroke-width="2"
      stroke-linejoin="round"
    />

    <!-- 3. Iced-Out Diamond Fill (Equal Symmetrical Arcs) -->
    <path
      d="M 132,66 
         C 132,40 114,24 90,24 
         C 66,24 48,40 48,66 
         C 48,88 74,96 90,98 
         C 106,100 132,108 132,134 
         C 132,160 114,176 90,176 
         C 66,176 48,160 48,134 
         L 60,134 
         C 60,150 72,164 90,164 
         C 108,164 120,150 120,134 
         C 120,116 94,108 76,104 
         C 58,100 28,90 28,66 
         C 28,40 52,8 90,8 
         C 128,8 152,40 152,66 
         Z"
      fill="url(#iceDiamondGrad)"
      stroke="#FFFFFF"
      stroke-width="1.8"
    />

    <!-- 4. Symmetrical Round Pavé Diamond Studs -->
    <!-- Top Arc Studs -->
    <circle cx="56" cy="36" r="4" fill="url(#diamondStud)" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="72" cy="28" r="4.5" fill="url(#diamondStud)" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="90" cy="26" r="4.5" fill="url(#diamondStud)" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="108" cy="28" r="4.5" fill="url(#diamondStud)" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="124" cy="36" r="4" fill="url(#diamondStud)" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="138" cy="52" r="4" fill="url(#diamondStud)" stroke="#FFFFFF" stroke-width="1" />

    <!-- Left Upper Arc Studs -->
    <circle cx="42" cy="52" r="4" fill="url(#diamondStud)" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="40" cy="70" r="4" fill="url(#diamondStud)" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="52" cy="84" r="4" fill="url(#diamondStud)" stroke="#FFFFFF" stroke-width="1" />

    <!-- Center Waist Studs -->
    <circle cx="70" cy="94" r="4.5" fill="url(#diamondStud)" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="90" cy="100" r="5" fill="url(#diamondStud)" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="110" cy="106" r="4.5" fill="url(#diamondStud)" stroke="#FFFFFF" stroke-width="1" />

    <!-- Right Lower Arc Studs -->
    <circle cx="128" cy="116" r="4" fill="url(#diamondStud)" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="140" cy="130" r="4" fill="url(#diamondStud)" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="138" cy="148" r="4" fill="url(#diamondStud)" stroke="#FFFFFF" stroke-width="1" />

    <!-- Bottom Arc Studs -->
    <circle cx="124" cy="164" r="4" fill="url(#diamondStud)" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="108" cy="172" r="4.5" fill="url(#diamondStud)" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="90" cy="174" r="4.5" fill="url(#diamondStud)" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="72" cy="172" r="4.5" fill="url(#diamondStud)" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="56" cy="164" r="4" fill="url(#diamondStud)" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="42" cy="148" r="4" fill="url(#diamondStud)" stroke="#FFFFFF" stroke-width="1" />

    <!-- 5. Vertical Pillar Diamond Studs (Top & Bottom Overhangs) -->
    <circle cx="79" cy="14" r="3.5" fill="url(#diamondStud)" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="101" cy="14" r="3.5" fill="url(#diamondStud)" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="79" cy="186" r="3.5" fill="url(#diamondStud)" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="101" cy="186" r="3.5" fill="url(#diamondStud)" stroke="#FFFFFF" stroke-width="1" />

    <!-- 6. Sparkling Specular Star Glints (Light Flares) -->
    <!-- Top-Right Star -->
    <g transform="translate(142, 44)">
      <polygon points="0,-14 3,-3 14,0 3,3 0,14 -3,3 -14,0 -3,-3" fill="#FFFFFF" />
      <circle cx="0" cy="0" r="2.5" fill="#FFE600" />
    </g>

    <!-- Center-Left Star -->
    <g transform="translate(38, 76)">
      <polygon points="0,-12 2.5,-2.5 12,0 2.5,2.5 0,12 -2.5,2.5 -12,0 -2.5,-2.5" fill="#FFFFFF" />
      <circle cx="0" cy="0" r="2" fill="#00F5FF" />
    </g>

    <!-- Bottom-Center Star -->
    <g transform="translate(90, 174)">
      <polygon points="0,-14 3,-3 14,0 3,3 0,14 -3,3 -14,0 -3,-3" fill="#FFFFFF" />
      <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" />
    </g>
  </g>
</svg>
