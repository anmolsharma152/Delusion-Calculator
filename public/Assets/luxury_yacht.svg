<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140" width="320" height="140">
  <defs>
    <!-- White Hull Gradient -->
    <linearGradient id="whiteHull" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Superstructure Gradient -->
    <linearGradient id="superstructure" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- Tinted Glass Gradient -->
    <linearGradient id="tintedGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="40%" stop-color="#00F5FF" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <!-- Cyan Neon Glow -->
    <filter id="yachtGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#yachtGlow)">
    <!-- 1. Deep Water Surface Line & Wake Splashes -->
    <path d="M 5,122 Q 40,120 90,123 T 190,121 T 290,124 T 315,122" fill="none" stroke="rgba(0, 245, 255, 0.4)" stroke-width="2" />
    <circle cx="20" cy="122" r="3.5" fill="rgba(0, 245, 255, 0.7)" />
    <circle cx="10" cy="124" r="2.5" fill="rgba(0, 245, 255, 0.5)" />

    <!-- 2. Stern Teak Swim Platform -->
    <rect x="18" y="112" width="16" height="6" rx="2" fill="#D97706" stroke="#92400E" stroke-width="1" />
    <line x1="22" y1="112" x2="22" y2="118" stroke="#78350F" stroke-width="1" />
    <line x1="26" y1="112" x2="26" y2="118" stroke="#78350F" stroke-width="1" />
    <line x1="30" y1="112" x2="30" y2="118" stroke="#78350F" stroke-width="1" />

    <!-- 3. Sleek Luxury Superyacht Main Hull -->
    <path
      d="M 30,114 
         L 230,114 
         Q 275,110 305,74 
         L 280,68 
         L 32,68 
         L 26,104 
         Z"
      fill="url(#whiteHull)"
      stroke="#00F5FF"
      stroke-width="2"
      stroke-linejoin="round"
    />

    <!-- Electric Cyan & Crimson Pink Waterline Racing Stripes -->
    <path d="M 28,104 L 255,104 Q 282,100 298,82" fill="none" stroke="#00F5FF" stroke-width="3" stroke-linecap="round" />
    <path d="M 27,108 L 245,108 Q 272,105 288,92" fill="none" stroke="#FF007F" stroke-width="2" stroke-linecap="round" />

    <!-- Hull Porthole Windows (Stainless Steel Oval Rings) -->
    <ellipse cx="65" cy="86" rx="4" ry="2.5" fill="#020617" stroke="#00F5FF" stroke-width="1" />
    <ellipse cx="85" cy="86" rx="4" ry="2.5" fill="#020617" stroke="#00F5FF" stroke-width="1" />
    <ellipse cx="105" cy="86" rx="4" ry="2.5" fill="#020617" stroke="#00F5FF" stroke-width="1" />
    <ellipse cx="125" cy="86" rx="4" ry="2.5" fill="#020617" stroke="#00F5FF" stroke-width="1" />
    <ellipse cx="145" cy="86" rx="4" ry="2.5" fill="#020617" stroke="#00F5FF" stroke-width="1" />
    <ellipse cx="165" cy="86" rx="4" ry="2.5" fill="#020617" stroke="#00F5FF" stroke-width="1" />

    <!-- Stainless Steel Bow Railings -->
    <path d="M 220,68 L 220,60 L 292,60 L 305,74" fill="none" stroke="#94A3B8" stroke-width="1.8" />
    <line x1="245" y1="60" x2="245" y2="68" stroke="#94A3B8" stroke-width="1.5" />
    <line x1="270" y1="60" x2="270" y2="68" stroke="#94A3B8" stroke-width="1.5" />

    <!-- 4. Tier 2: Main Deck Superstructure & Panoramic Salon Windows -->
    <path
      d="M 52,68 
         L 225,68 
         L 205,42 
         L 48,42 
         Z"
      fill="url(#superstructure)"
      stroke="#00F5FF"
      stroke-width="1.8"
      stroke-linejoin="round"
    />

    <!-- Panoramic Tinted Forward Salon Windows -->
    <path
      d="M 85,63 
         L 212,63 
         L 196,47 
         L 85,47 
         Z"
      fill="url(#tintedGlass)"
      stroke="#38BDF8"
      stroke-width="1.2"
    />

    <!-- Window Pillar Separators -->
    <line x1="118" y1="47" x2="118" y2="63" stroke="#FFFFFF" stroke-width="1.5" />
    <line x1="152" y1="47" x2="152" y2="63" stroke="#FFFFFF" stroke-width="1.5" />
    <line x1="182" y1="47" x2="182" y2="63" stroke="#FFFFFF" stroke-width="1.5" />

    <!-- 5. Tier 3: Upper Bridge Deck & Flybridge Hardtop -->
    <path
      d="M 72,42 
         L 175,42 
         L 160,22 
         L 65,22 
         Z"
      fill="url(#superstructure)"
      stroke="#00F5FF"
      stroke-width="1.5"
      stroke-linejoin="round"
    />

    <!-- Upper Bridge Tinted Windshield -->
    <path
      d="M 115,38 
         L 165,38 
         L 154,26 
         L 115,26 
         Z"
      fill="url(#tintedGlass)"
      stroke="#38BDF8"
      stroke-width="1"
    />

    <!-- Flybridge Sunroof Hardtop -->
    <path d="M 60,22 L 152,22 L 144,14 L 68,14 Z" fill="#FFFFFF" stroke="#00F5FF" stroke-width="1.2" />

    <!-- 6. Navigation Radar Arch, Dual Sat Domes & Antennas -->
    <!-- Radar Mast Arch -->
    <path d="M 90,14 L 98,3 L 108,3 L 102,14" fill="#00F5FF" />
    <!-- Radar Scanner Bar -->
    <rect x="94" y="1" width="18" height="3" rx="1.5" fill="#FFE600" stroke="#B45309" stroke-width="0.8" />

    <!-- Twin Satellite Communication Domes -->
    <circle cx="82" cy="9" r="5" fill="#FFFFFF" stroke="#00F5FF" stroke-width="1.2" />
    <line x1="77" y1="9" x2="87" y2="9" stroke="#FF007F" stroke-width="1" />

    <circle cx="118" cy="9" r="4.5" fill="#FFFFFF" stroke="#00F5FF" stroke-width="1.2" />
    <line x1="113.5" y1="9" x2="122.5" y2="9" stroke="#FF007F" stroke-width="1" />

    <!-- Chrome Radio Antenna -->
    <line x1="126" y1="14" x2="134" y2="-2" stroke="#E2E8F0" stroke-width="1.2" />
  </g>
</svg>
