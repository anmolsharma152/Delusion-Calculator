<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 180" width="160" height="180">
  <defs>
    <!-- Ice Diamond Gradient -->
    <linearGradient id="iceDiamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#E0F7FA" />
      <stop offset="50%" stop-color="#00F5FF" />
      <stop offset="80%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <linearGradient id="goldEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE600" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Diamond Stud Gradient -->
    <radialGradient id="studGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E0F2FE" />
      <stop offset="80%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#0369A1" />
    </radialGradient>

    <!-- Ice Glow Filter -->
    <filter id="iceGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#iceGlow)">
    <!-- 1. Gold Base Shadow Plate -->
    <!-- Vertical Spine -->
    <rect x="70" y="8" width="20" height="164" rx="10" fill="url(#goldEdge)" stroke="#78350F" stroke-width="2" />

    <!-- Outer S-Curve Body -->
    <path
      d="M 125,56 
         C 125,28 108,18 80,18 
         C 46,18 36,36 36,60 
         C 36,92 70,100 95,108 
         C 118,116 126,126 126,140 
         C 126,158 108,168 80,168 
         C 50,168 34,152 32,126 
         L 54,124 
         C 56,140 68,150 80,150 
         C 95,150 104,142 104,136 
         C 104,116 74,106 50,98 
         C 30,90 16,76 16,56 
         C 16,30 38,4 80,4 
         C 118,4 144,22 146,56 
         Z"
      fill="url(#goldEdge)"
      stroke="#78350F"
      stroke-width="2.5"
    />

    <!-- 2. Iced-Out Diamond Infill Core -->
    <!-- Vertical Spine Diamonds -->
    <rect x="74" y="14" width="12" height="152" rx="6" fill="url(#iceDiamondGrad)" stroke="#FFFFFF" stroke-width="1.5" />

    <!-- S-Curve Diamond Layer -->
    <path
      d="M 120,56 
         C 120,32 104,24 80,24 
         C 50,24 42,40 42,60 
         C 42,88 74,96 98,104 
         C 122,112 120,122 120,136 
         C 120,152 104,162 80,162 
         C 56,162 40,148 38,126 
         L 52,126 
         C 54,138 66,146 80,146 
         C 92,146 100,138 100,132 
         C 100,118 72,110 48,102 
         C 28,94 22,78 22,58 
         C 22,34 44,10 80,10 
         C 114,10 138,26 140,56 
         Z"
      fill="url(#iceDiamondGrad)"
      stroke="#FFFFFF"
      stroke-width="2"
    />

    <!-- 3. Pavé Diamond Stud Clusters (Round Brilliant Studs Along the Shape) -->
    <!-- Top Curve Studs -->
    <circle cx="58" cy="24" r="4" fill="url(#studGrad)" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="78" cy="18" r="4.5" fill="url(#studGrad)" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="98" cy="20" r="4" fill="url(#studGrad)" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="116" cy="30" r="4" fill="url(#studGrad)" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="128" cy="46" r="4" fill="url(#studGrad)" stroke="#FFFFFF" stroke-width="1" />

    <!-- Left Upper Studs -->
    <circle cx="34" cy="44" r="4" fill="url(#studGrad)" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="30" cy="62" r="4" fill="url(#studGrad)" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="38" cy="78" r="4" fill="url(#studGrad)" stroke="#FFFFFF" stroke-width="1" />

    <!-- Center Diagonal Studs -->
    <circle cx="56" cy="90" r="4" fill="url(#studGrad)" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="80" cy="98" r="4.5" fill="url(#studGrad)" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="104" cy="108" r="4" fill="url(#studGrad)" stroke="#FFFFFF" stroke-width="1" />

    <!-- Lower Curve Studs -->
    <circle cx="120" cy="124" r="4" fill="url(#studGrad)" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="116" cy="144" r="4" fill="url(#studGrad)" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="100" cy="156" r="4" fill="url(#studGrad)" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="80" cy="158" r="4.5" fill="url(#studGrad)" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="60" cy="154" r="4" fill="url(#studGrad)" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="44" cy="140" r="4" fill="url(#studGrad)" stroke="#FFFFFF" stroke-width="1" />

    <!-- Center Vertical Studs -->
    <circle cx="80" cy="42" r="3.5" fill="url(#studGrad)" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="80" cy="64" r="3.5" fill="url(#studGrad)" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="80" cy="126" r="3.5" fill="url(#studGrad)" stroke="#FFFFFF" stroke-width="1" />

    <!-- 4. Glistening Specular Diamond Flare Glints -->
    <!-- Top Right Flare -->
    <g transform="translate(132, 38)">
      <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="#FFFFFF" />
      <circle cx="0" cy="0" r="2.5" fill="#FFE600" />
    </g>

    <!-- Center Left Flare -->
    <g transform="translate(28, 70)">
      <polygon points="0,-10 2.5,-2.5 10,0 2.5,2.5 0,10 -2.5,2.5 -10,0 -2.5,-2.5" fill="#FFFFFF" />
      <circle cx="0" cy="0" r="2" fill="#00F5FF" />
    </g>

    <!-- Bottom Center Flare -->
    <g transform="translate(80, 160)">
      <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="#FFFFFF" />
      <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" />
    </g>
  </g>
</svg>
