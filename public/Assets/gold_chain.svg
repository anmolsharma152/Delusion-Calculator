<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Gold Gradients -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="25%" stop-color="#FFE600" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="90%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <linearGradient id="goldDark" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE600" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <radialGradient id="medallionGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="30%" stop-color="#FFE600" />
      <stop offset="75%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </radialGradient>

    <!-- Neon Yellow Glow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#goldGlow)">
    <!-- Continuous Circular Cuban Link Necklace Loop -->
    <!-- Outer Glow Ring -->
    <circle cx="100" cy="95" r="62" fill="none" stroke="rgba(255, 230, 0, 0.25)" stroke-width="14" />

    <!-- 16 Interlocking Cuban Links along Circular Path -->
    <!-- Link 1 (Top) -->
    <g transform="translate(100, 33) rotate(0)">
      <rect x="-14" y="-8" width="28" height="16" rx="8" fill="url(#goldLight)" stroke="#78350F" stroke-width="1.5" />
      <rect x="-8" y="-4" width="16" height="8" rx="4" fill="#0c0721" />
      <line x1="-12" y1="-6" x2="12" y2="6" stroke="#FFFDF0" stroke-width="1.2" stroke-linecap="round" />
    </g>
    <!-- Link 2 -->
    <g transform="translate(124, 38) rotate(22.5)">
      <rect x="-14" y="-8" width="28" height="16" rx="8" fill="url(#goldDark)" stroke="#78350F" stroke-width="1.5" />
      <rect x="-8" y="-4" width="16" height="8" rx="4" fill="#0c0721" />
    </g>
    <!-- Link 3 -->
    <g transform="translate(144, 51) rotate(45)">
      <rect x="-14" y="-8" width="28" height="16" rx="8" fill="url(#goldLight)" stroke="#78350F" stroke-width="1.5" />
      <rect x="-8" y="-4" width="16" height="8" rx="4" fill="#0c0721" />
      <line x1="-12" y1="-6" x2="12" y2="6" stroke="#FFFDF0" stroke-width="1.2" stroke-linecap="round" />
    </g>
    <!-- Link 4 -->
    <g transform="translate(157, 71) rotate(67.5)">
      <rect x="-14" y="-8" width="28" height="16" rx="8" fill="url(#goldDark)" stroke="#78350F" stroke-width="1.5" />
      <rect x="-8" y="-4" width="16" height="8" rx="4" fill="#0c0721" />
    </g>
    <!-- Link 5 (Right) -->
    <g transform="translate(162, 95) rotate(90)">
      <rect x="-14" y="-8" width="28" height="16" rx="8" fill="url(#goldLight)" stroke="#78350F" stroke-width="1.5" />
      <rect x="-8" y="-4" width="16" height="8" rx="4" fill="#0c0721" />
      <line x1="-12" y1="-6" x2="12" y2="6" stroke="#FFFDF0" stroke-width="1.2" stroke-linecap="round" />
    </g>
    <!-- Link 6 -->
    <g transform="translate(157, 119) rotate(112.5)">
      <rect x="-14" y="-8" width="28" height="16" rx="8" fill="url(#goldDark)" stroke="#78350F" stroke-width="1.5" />
      <rect x="-8" y="-4" width="16" height="8" rx="4" fill="#0c0721" />
    </g>
    <!-- Link 7 -->
    <g transform="translate(144, 139) rotate(135)">
      <rect x="-14" y="-8" width="28" height="16" rx="8" fill="url(#goldLight)" stroke="#78350F" stroke-width="1.5" />
      <rect x="-8" y="-4" width="16" height="8" rx="4" fill="#0c0721" />
      <line x1="-12" y1="-6" x2="12" y2="6" stroke="#FFFDF0" stroke-width="1.2" stroke-linecap="round" />
    </g>
    <!-- Link 8 -->
    <g transform="translate(124, 152) rotate(157.5)">
      <rect x="-14" y="-8" width="28" height="16" rx="8" fill="url(#goldDark)" stroke="#78350F" stroke-width="1.5" />
      <rect x="-8" y="-4" width="16" height="8" rx="4" fill="#0c0721" />
    </g>
    <!-- Link 9 (Bottom Bail) -->
    <g transform="translate(100, 157) rotate(180)">
      <rect x="-14" y="-8" width="28" height="16" rx="8" fill="url(#goldLight)" stroke="#78350F" stroke-width="1.5" />
      <rect x="-8" y="-4" width="16" height="8" rx="4" fill="#0c0721" />
    </g>
    <!-- Link 10 -->
    <g transform="translate(76, 152) rotate(202.5)">
      <rect x="-14" y="-8" width="28" height="16" rx="8" fill="url(#goldDark)" stroke="#78350F" stroke-width="1.5" />
      <rect x="-8" y="-4" width="16" height="8" rx="4" fill="#0c0721" />
    </g>
    <!-- Link 11 -->
    <g transform="translate(56, 139) rotate(225)">
      <rect x="-14" y="-8" width="28" height="16" rx="8" fill="url(#goldLight)" stroke="#78350F" stroke-width="1.5" />
      <rect x="-8" y="-4" width="16" height="8" rx="4" fill="#0c0721" />
      <line x1="-12" y1="-6" x2="12" y2="6" stroke="#FFFDF0" stroke-width="1.2" stroke-linecap="round" />
    </g>
    <!-- Link 12 -->
    <g transform="translate(43, 119) rotate(247.5)">
      <rect x="-14" y="-8" width="28" height="16" rx="8" fill="url(#goldDark)" stroke="#78350F" stroke-width="1.5" />
      <rect x="-8" y="-4" width="16" height="8" rx="4" fill="#0c0721" />
    </g>
    <!-- Link 13 (Left) -->
    <g transform="translate(38, 95) rotate(270)">
      <rect x="-14" y="-8" width="28" height="16" rx="8" fill="url(#goldLight)" stroke="#78350F" stroke-width="1.5" />
      <rect x="-8" y="-4" width="16" height="8" rx="4" fill="#0c0721" />
      <line x1="-12" y1="-6" x2="12" y2="6" stroke="#FFFDF0" stroke-width="1.2" stroke-linecap="round" />
    </g>
    <!-- Link 14 -->
    <g transform="translate(43, 71) rotate(292.5)">
      <rect x="-14" y="-8" width="28" height="16" rx="8" fill="url(#goldDark)" stroke="#78350F" stroke-width="1.5" />
      <rect x="-8" y="-4" width="16" height="8" rx="4" fill="#0c0721" />
    </g>
    <!-- Link 15 -->
    <g transform="translate(56, 51) rotate(315)">
      <rect x="-14" y="-8" width="28" height="16" rx="8" fill="url(#goldLight)" stroke="#78350F" stroke-width="1.5" />
      <rect x="-8" y="-4" width="16" height="8" rx="4" fill="#0c0721" />
      <line x1="-12" y1="-6" x2="12" y2="6" stroke="#FFFDF0" stroke-width="1.2" stroke-linecap="round" />
    </g>
    <!-- Link 16 -->
    <g transform="translate(76, 38) rotate(337.5)">
      <rect x="-14" y="-8" width="28" height="16" rx="8" fill="url(#goldDark)" stroke="#78350F" stroke-width="1.5" />
      <rect x="-8" y="-4" width="16" height="8" rx="4" fill="#0c0721" />
    </g>

    <!-- Center Hanging Gold Medallion / Coin -->
    <g transform="translate(100, 160)">
      <!-- Bail Connector Loop -->
      <path d="M-5,-10 L5,-10 L4,0 L-4,0 Z" fill="url(#goldLight)" stroke="#78350F" stroke-width="1" />
      <!-- Outer Medallion Bezel with Diamond Studs -->
      <circle cx="0" cy="16" r="22" fill="url(#medallionGrad)" stroke="#FFE600" stroke-width="3" />
      <circle cx="0" cy="16" r="18" fill="none" stroke="#78350F" stroke-dasharray="3,3" stroke-width="1.5" />
      <!-- Center High-Relief Medallion Star / Logo -->
      <path d="M0,6 L3,13 L10,13 L5,18 L7,25 L0,20 L-7,25 L-5,18 L-10,13 L-3,13 Z" fill="#FFFDF0" stroke="#FFE600" stroke-width="1" />
      <!-- Specular Sparkle -->
      <polygon points="-12,8 -9,11 -12,14 -15,11" fill="#FFFFFF" />
      <polygon points="12,24 15,27 12,30 9,27" fill="#FFFFFF" />
    </g>
  </g>
</svg>
